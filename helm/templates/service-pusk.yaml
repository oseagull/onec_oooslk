{{- if .Values.pusk.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "onec-enterprise.fullname" . }}-pusk
  labels:
    {{- include "onec-enterprise.labels" . | nindent 4 }}
    app.kubernetes.io/component: pusk
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "onec-enterprise.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: pusk
{{- end }}