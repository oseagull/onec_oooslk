{{- if .Values.srv.persistence.data.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "onec-enterprise.fullname" . }}-srv-data
  labels:
    {{- include "onec-enterprise.labels" . | nindent 4 }}
    app.kubernetes.io/component: srv
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.global.storageClass }}
  resources:
    requests:
      storage: {{ .Values.srv.persistence.data.size }}
{{- end }}
---
{{- if .Values.srv.persistence.logs.enabled }}
