{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "onec-enterprise.fullname" . }}
  labels:
    {{- include "onec-enterprise.labels" . | nindent 4 }}
  annotations:
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    kubernetes.io/ingress.class: nginx
spec:
  rules:
  - host: {{ .Values.ingress.host | quote }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ include "onec-enterprise.fullname" . }}-srv
            port:
              number: 80
      {{- if .Values.pusk.enabled }}
      - path: /pusk
        pathType: Prefix
        backend:
          service:
            name: {{ include "onec-enterprise.fullname" . }}-pusk
            port:
              number: 8080
      {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- toYaml .Values.ingress.tls | nindent 4 }}
  {{- end }}
{{- end }}
---
{{- if and .Values.ingress.enabled .Values.ingress.basicAuth.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "onec-enterprise.fullname" . }}-basic-auth
  labels:
    {{- include "onec-enterprise.labels" . | nindent 4 }}
type: Opaque
data:
  auth: {{ htpasswd .Values.ingress.basicAuth.username .Values.ingress.basicAuth.password | b64enc }}
{{- end }}